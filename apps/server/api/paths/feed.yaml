paths:
  create:
    post:
      tags:
        - Feed
      summary: 게시글 작성
      operationId: createPost
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  minLength: 1
                  example: "오늘의 게시글입니다"
      responses:
        "201":
          description: 게시글 작성 성공
          content:
            application/json:
              schema:
                $ref: "../schemas/post.yaml#/Post"
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "../schemas/error.yaml#/Error"
        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "../schemas/error.yaml#/Error"

  list:
    get:
      tags:
        - Feed
      summary: 피드 목록 조회
      operationId: getFeed
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: 이전 응답의 next_cursor 값
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 피드 조회 성공
          content:
            application/json:
              schema:
                $ref: "../schemas/post.yaml#/Feed"
        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "../schemas/error.yaml#/Error"

  by-id:
    get:
      tags:
        - Feed
      summary: 게시글 상세 조회
      operationId: getPost
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 게시글 조회 성공
          content:
            application/json:
              schema:
                $ref: "../schemas/post.yaml#/Post"
        "404":
          description: 게시글을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "../schemas/error.yaml#/Error"

  update:
    put:
      tags:
        - Feed
      summary: 게시글 수정
      operationId: updatePost
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  minLength: 1
                  example: "수정된 게시글입니다"
      responses:
        "200":
          description: 게시글 수정 성공
          content:
            application/json:
              schema:
                $ref: "../schemas/post.yaml#/Post"
        "404":
          description: 게시글을 찾을 수 없거나 권한 없음
          content:
            application/json:
              schema:
                $ref: "../schemas/error.yaml#/Error"

  delete:
    delete:
      tags:
        - Feed
      summary: 게시글 삭제
      operationId: deletePost
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 게시글 삭제 성공
        "404":
          description: 게시글을 찾을 수 없거나 권한 없음
          content:
            application/json:
              schema:
                $ref: "../schemas/error.yaml#/Error"

  like:
    post:
      tags:
        - Feed
      summary: 좋아요
      operationId: likePost
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 좋아요 성공
        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "../schemas/error.yaml#/Error"

  unlike:
    delete:
      tags:
        - Feed
      summary: 좋아요 취소
      operationId: unlikePost
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 좋아요 취소 성공
        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "../schemas/error.yaml#/Error"
